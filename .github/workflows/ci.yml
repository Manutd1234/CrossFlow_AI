name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the tested Node 24 LTS runtime. jsdom 30/undici require
          # newer platform APIs than the old Node 22.13 runner provides.
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      # pytest is a CI-only runner; keep it out of the pinned API runtime.
      - name: Install backend test runner
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend checks
        run: python backend/test_backend.py
      # pytest collects both unittest.TestCase methods and function-style tests,
      # including the HTTP subprocess checks, in one pass.
      - name: Run modular backend tests
        run: python -m pytest backend/tests -q
      - name: Run authentication boundary tests
        run: python -m unittest discover -s backend/auth/tests -t . -p 'test_*.py'
      - name: Stress congestion calculation invariants
        run: python scripts/validate_congestion_engine.py --scenarios 10000 --output /tmp/congestion-validation.json
      - name: Set up Node.js for PostgreSQL policy tests
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: backend/auth/package-lock.json
      - name: Test authentication schema and row-level security
        working-directory: backend/auth
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Validate launcher syntax
        run: bash -n scripts/dev.sh
